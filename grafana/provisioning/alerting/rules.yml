# IOT-07 : plus de 35 °C pendant 10 minutes dans une serre (une alerte par serre).
apiVersion: 1
groups:
  - orgId: 1
    name: serres-temperature
    folder: Serres
    interval: 1m
    rules:
      - uid: temp-sup-35-10min
        title: Température > 35 °C pendant 10 min
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Serre {{ $labels.metric }} : température moyenne supérieure à 35 °C depuis plus de 10 minutes"
        data:
          - refId: A
            relativeTimeRange: { from: 180, to: 0 }
            datasourceUid: pg-greenhouse
            model:
              refId: A
              format: time_series
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT $__timeGroupAlias(event_time, '1m'),
                       greenhouse_id AS metric,
                       avg(value) AS value
                FROM live_measurements
                WHERE $__timeFilter(event_time) AND metric = 'temperature' AND status = 'ok'
                GROUP BY 1, 2
                ORDER BY 1
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [35] }
