# Source de données PostgreSQL (table live_measurements). Aucun secret : valeurs lues dans l'environnement du conteneur.
apiVersion: 1
datasources:
  - name: PostgreSQL
    uid: pg-greenhouse
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
