version: 2

models:
  - name: stg_measurements
    description: "Silver typé. Grain : un capteur sur une minute."
    data_tests:
      - unique_combination:
          arguments:
            columns: [sensor_id, minute_ts]
    columns:
      - name: sensor_id
        data_tests: [not_null]
      - name: minute_ts
        data_tests: [not_null]
      - name: metric
        data_tests:
          - accepted_values:
              arguments:
                values: [temperature, air_humidity, soil_humidity, co2]
      - name: n_readings
        data_tests:
          - expression_is_true:
              arguments:
                expression: "n_readings between 1 and 2"
