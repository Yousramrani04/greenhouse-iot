name: ci

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Installer les dépendances légères
        run: pip install -r requirements-ci.txt

      - name: Tests pytest (classement, générateur reproductible, Isolation Forest)
        run: python -m pytest -q

      - name: Générer l'échantillon Parquet (format de l'export Silver)
        run: python scripts/make_ci_sample.py

      - name: dbt build sur l'échantillon
        working-directory: dbt
        env:
          # valeurs factices : dbt lit un fichier local, pas MinIO
          MINIO_ROOT_USER: ci
          MINIO_ROOT_PASSWORD: ci-sans-secret
          SILVER_EXPORT_GLOB: ${{ github.workspace }}/ci_sample/measurements_1min/*.parquet
          SILVER_REJECTED_GLOB: ${{ github.workspace }}/ci_sample/measurements_rejected/*.parquet
        run: dbt build --profiles-dir .

      - name: Vérifier le Gold
        run: python scripts/check_ci_gold.py

      - name: Valider docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q
