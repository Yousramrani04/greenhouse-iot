services:
  silo:
    image: pgsty/silo:latest
    container_name: silo
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT}:9000"      # API S3
      - "${MINIO_CONSOLE_PORT}:9001"  # console web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - silo_data:/data

  silo-init:
    image: pgsty/mc:latest
    depends_on:
      - silo
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://silo:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'attente de silo...'; sleep 1;
      done;
      mc mb -p local/bronze local/silver local/gold;
      echo 'buckets prets';
      "

volumes:
  silo_data: